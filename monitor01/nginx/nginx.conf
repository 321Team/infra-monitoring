# monitor01 nginx — IF-06B Remote Write 수신(P1-MON-01 #17). runtime_launch_local.py start-nginx가 이 파일을
# /etc/nginx/nginx.conf로 마운트한다. server 블록은 render_candidate.py(inputs.fds.json) 출력에서 아래 두 줄만 바꿨다
# (test_runtime_launch_local.py가 대조).
#   - listen 443 → 8443: rootless라 1024 미만 bind 불가. firewalld가 .108→.30:443만 8443으로 넘긴다(#17 5927596564).
#   - access_log 파일 → /dev/stdout: podman logs로 수집한다.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    server_tokens off;
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    # BEGIN render_candidate server
    # No request body, query string or Authorization header in this access log.
    log_format fds_monitor01 '$remote_addr $request_method $uri $status';
    server {
        listen 10.250.10.30:8443 ssl;
        server_name 10.250.10.30;
        ssl_certificate /etc/fds/monitor01/tls/monitor01.crt;
        ssl_certificate_key /etc/fds/pki/monitor01/request/monitor01.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        access_log /dev/stdout fds_monitor01;
        client_max_body_size 1m;

        location = /api/v1/write {
            if ($request_method != POST) { return 405; }
            if ($args != "") { return 400; }
            satisfy all;
            allow 10.1.93.108;
            deny all;
            auth_basic "FDS monitor01 remote write";
            auth_basic_user_file /etc/fds/monitor01/nginx/htpasswd;
            proxy_set_header Authorization "";
            proxy_http_version 1.1;
            proxy_pass http://127.0.0.1:19090;
        }
        location / { return 404; }
    }
    # END render_candidate server
}
