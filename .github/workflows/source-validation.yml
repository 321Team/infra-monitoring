name: Source validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.repository == '321Team/infra-monitoring'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source without persisting credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # inherited pin from infra-cicd
        with:
          persist-credentials: false
      - name: Static source checks
        run: |
          python3 -m pip install PyYAML==6.0.2
          python3 tools/check_source.py
      - name: Monitor01 candidate validation tests (no deployment)
        run: python3 -m unittest discover -s monitor01 -p 'test_*.py' -v
      - name: Check historical demo syntax without execution
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find references -type f -name '*.sh' -print0)
