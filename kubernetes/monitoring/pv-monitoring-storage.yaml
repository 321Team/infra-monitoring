# Storage 인계 결정(GitHub #17, Lead 이재환 2026-09-21, GWONUK 실측 제안 수용).
# Provider: worker03(10.1.93.108, hostname k8s-worker03) NVMe, /home XFS 가용 ~163G.
# 정본 = 단일 designated Worker / static local PV, non-HA Known Limitation(문서화된 제약).
# host path: /home/fds-local-pv/{prometheus,grafana,alertmanager}
#
# 적용 전 필수 확인 — worker03 실측 완료 (2026-09-21, worker03 원격 셸에서 직접 실행한 명령 결과 기준):
#   1. 디렉터리 생성 완료: /home/fds-local-pv/{prometheus,grafana,alertmanager} (mkdir -p)
#   2. owner/mode 적용 완료: prometheus/alertmanager=nobody:nobody(65534:65534), grafana=472:472,
#      전부 mode 750 (`ls -la` 결과로 확인). UID 값 자체는 Harbor 승인 digest 확정 전 임시값이라
#      digest 확정 후 재확정 필요 — 이 부분만 이하영과 재검증 남음.
#   3. SELinux persistent fcontext 적용 완료: getenforce=Enforcing 확인 후
#      `semanage fcontext -a -t container_file_t "/home/fds-local-pv(/.*)?"` + `restorecon -Rv` 실행,
#      user_home_dir_t/user_home_t → container_file_t relabel 성공 확인.
#   4. 실제 free space 재확인 완료: `df -h /home` → 167G 중 163G 가용(2% 사용) — 제안 시점 실측과 일치.
#   증적(2026-09-26 편입): fds-project-evidence `evidence/P1-MON-01/received-20260926T0401Z/`
#     - worker03-20260921/console-transcript.txt: 위 1~4의 9/21 실행 출력(콘솔 제출 자료, 서버 Hash 없음)
#     - worker03-20260926/pv-recheck.txt: 9/26 재확인(서버 파일). fcontext 등록 확인. mode는 750→2770
#       (Pod fsGroup 적용 영향으로 추정, NOT VERIFIED), owner·라벨·가용량은 같음.
#
# PVC 20Gi/5Gi/2Gi 는 CONFIG_DEFAULT_CANDIDATE — 불변값 아님, Runtime 사용률로 조정 가능.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: fds-local-storage
provisioner: kubernetes.io/no-provisioner   # static PV, 동적 프로비저닝 없음
volumeBindingMode: WaitForFirstConsumer     # Pod가 실제 스케줄되는 시점까지 바인딩 지연
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: prometheus-data-pv
spec:
  capacity:
    storage: 20Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain   # 실수로 PVC 삭제해도 TSDB 데이터 보존
  storageClassName: fds-local-storage
  local:
    path: /home/fds-local-pv/prometheus
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: ["k8s-worker03"]
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: grafana-data-pv
spec:
  capacity:
    storage: 5Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: fds-local-storage
  local:
    path: /home/fds-local-pv/grafana
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: ["k8s-worker03"]
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: alertmanager-data-pv
spec:
  capacity:
    storage: 2Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: fds-local-storage
  local:
    path: /home/fds-local-pv/alertmanager
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: ["k8s-worker03"]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: monitoring-api
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: fds-local-storage
  volumeName: prometheus-data-pv   # static PV 1:1 binding 명시 (non-HA, 단일 후보 PV라 selector 대신 직접 지정)
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alertmanager-data
  namespace: monitoring-api
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: fds-local-storage
  volumeName: alertmanager-data-pv
  resources:
    requests:
      storage: 2Gi
