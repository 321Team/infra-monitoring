apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring-api
data:
  # A1 (시나리오 v1.4 §2) — "화면 수신 1개".
  # [BL] §11.2 P0 = Firing/Resolved 화면 수신·그룹화 뿐. IF-24(메일/SMS/메신저) = RETIRED.
  # ⚠ route 분기 PR(#75 MON Lead 결정: Discord 발송 범위 제한) 병합 전에는 이 ConfigMap을 현장에 적용하지 않는다.
  #   아래 기본 receiver는 전체 알림을 Discord로 보내며, 결정된 발송 범위와 다르다(Runbook §B-1).
  # 외부 integration은 원칙적으로 넣지 않는다(D33). 단 CR-P1-MON-01-02(#75)로 Discord webhook 1개 목적지만
  # 예외 허용 — MON Lead 승인: https://github.com/321Team/fds-project-baseline/issues/75#issuecomment-5842829934
  # (2026-09-26). 예외 D-ID는 정본 등록 대기(#75 Decision). 경로: egress-proxy01(10.1.93.56:3128) → discord.com:443.
  # 이 receiver 구성은 #75 실전송 보고(2026-09-22)의 현장 적용 형상을 옮긴 것이다.
  # config reload: Alertmanager 는 파일 변경 시 자동 reload(inotify) 하므로 rollout restart 불필요.
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      # 기본은 화면 표시만. Discord는 severity=critical과 FDSDetectionBurst(이상거래 급증)만 보낸다(P1-MON-01 Lead 결정, #75).
      receiver: 'screen-only'
      # alertname + severity 로 묶어서 UI 한 줄로 본다
      group_by: ['alertname', 'severity']
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 1h
      routes:
        # Discord 대상: critical(현재 룰 기준 TargetDown)과 업무 알림 FDSDetectionBurst(warning).
        # 그 밖의 warning·info(NodeExporterDown·KubeletScrapeDown known-issue, p0 시험 알림 포함)는 기본 receiver(screen-only).
        - matchers:
            - severity = "critical"
          receiver: 'discord-notifications'
        - matchers:
            - alertname = "FDSDetectionBurst"
          receiver: 'discord-notifications'

    # 같은 alertname 에 대해 critical 이 firing 이면 warning 은 UI에서 억제
    inhibit_rules:
      - source_matchers: [ 'severity = "critical"' ]
        target_matchers: [ 'severity = "warning"' ]
        equal: ['alertname']

    receivers:
      # integration 없음 = 알림이 화면(Alertmanager UI)에만 뜬다. 미사용이지만 롤백 대비 보존(#75 승인 범위).
      - name: 'screen-only'

      # Alertmanager UI 표시는 receiver와 무관하게 유지된다.
      - name: 'discord-notifications'
        discord_configs:
          - webhook_url_file: /etc/alertmanager/secrets/discord/webhook_url   # Secret discord-webhook 마운트
            send_resolved: true
            http_config:
              proxy_url: http://10.1.93.56:3128   # proxy_url은 http_config 하위여야 한다(최상위면 기동 실패, #75)
