apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring-api
spec:
  replicas: 1
  strategy:
    type: Recreate            # PVC(RWO) 재부착 충돌 방지
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      imagePullSecrets:
        - name: harbor-pull-secret
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534   # OPEN(#17): Harbor 승인 digest 확정 후 실제 native UID로 재확정 필요
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch   # Storage 인계 결정(#17) 수용
      containers:
      - name: alertmanager
        image: 10.1.93.54/fds/alertmanager:latest
        args:
        - --config.file=/etc/alertmanager/alertmanager.yml
        - --storage.path=/alertmanager
        ports:
        - containerPort: 9093
        # #17 AC: 컴포넌트 공식 Probe. startup 이 통과할 때까지 liveness/readiness 는 시작되지 않는다.
        startupProbe:
          httpGet: { path: /-/ready, port: 9093 }
          periodSeconds: 5
          failureThreshold: 36        # 최대 3분 기동 유예
        readinessProbe:
          httpGet: { path: /-/ready, port: 9093 }
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet: { path: /-/healthy, port: 9093 }
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 6         # 2분 연속 실패해야 재시작(오탐 재시작 루프 방지)
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: config
          mountPath: /etc/alertmanager
        - name: storage
          mountPath: /alertmanager
      volumes:
      - name: config
        configMap:
          name: alertmanager-config
      - name: storage
        # Storage 인계 결정(GitHub #17, Lead 이재환 2026-09-21): worker03 host path, PVC 2Gi.
        # emptyDir → PVC 이전: 재시작 시 silence/notification 상태 유실 방지.
        persistentVolumeClaim:
          claimName: alertmanager-data
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring-api
spec:
  selector:
    app: alertmanager
  ports:
  - port: 9093
    targetPort: 9093
