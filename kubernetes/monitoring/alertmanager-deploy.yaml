apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring-api
spec:
  replicas: 1
  strategy:
    type: Recreate            # PVC(RWO) 재부착 충돌 방지
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534   # OPEN(#17): Harbor 승인 digest 확정 후 실제 native UID로 재확정 필요
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch   # Storage 인계 결정(#17) 수용
      imagePullSecrets:          # Harbor 비공개 프로젝트 인증(#17 9/22 생성, 값은 저장소 밖)
        - name: harbor-pull-secret
      containers:
      - name: alertmanager
        # 현장 형상(2026-09-24 05:59 KST 수집, docs/MON_FOLLOWUP_RECEIPT_20260924T055938.md).
        # OPEN(#17): 승인 digest 미확정. Harbor 수동 미러링(#17 9/22, Trivy Gate 미경유)이라
        #   관측 imageID sha256:babefaac616bdb9fb5037a2b70a3c0ffa988c68e96443621dd7360e60781ab67를 승인 digest로 간주하지 않는다.
        image: 10.1.93.54/fds/alertmanager:latest
        args:
        - --config.file=/etc/alertmanager/alertmanager.yml
        - --storage.path=/alertmanager
        ports:
        - containerPort: 9093
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: config
          mountPath: /etc/alertmanager
        - name: storage
          mountPath: /alertmanager
        # CR-P1-MON-01-02(#75): Discord webhook URL은 Secret 파일로만 참조한다(평문 저장 금지, D35 예외).
        # subPath를 쓰지 않는다 — Secret 갱신이 볼륨으로 전파되고, v0.34.1 Discord notifier가
        # 알림마다 webhook_url_file을 다시 읽는다(docs/ALERTMANAGER_SECRET_LIFECYCLE_REVIEW_20260924.md).
        - name: discord-webhook
          mountPath: /etc/alertmanager/secrets/discord
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: alertmanager-config
      - name: storage
        # Storage 인계 결정(GitHub #17, Lead 이재환 2026-09-21): worker03 host path, PVC 2Gi.
        # emptyDir → PVC 이전: 재시작 시 silence/notification 상태 유실 방지.
        persistentVolumeClaim:
          claimName: alertmanager-data
      - name: discord-webhook
        # Secret(key=webhook_url)은 #75 Lead가 저장소 밖에서 생성·회전한다. 값·YAML을 커밋하지 않는다.
        secret:
          secretName: discord-webhook
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring-api
spec:
  selector:
    app: alertmanager
  ports:
  - port: 9093
    targetPort: 9093
