apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring-api
spec:
  replicas: 1
  strategy:
    type: Recreate            # PVC(RWO) 재부착 충돌 방지
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      imagePullSecrets:
        - name: harbor-pull-secret
      serviceAccountName: alertmanager-sa   # 2026-09-27 전용 SA(monitoring-api-serviceaccounts.yaml)
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534   # OPEN(#17): Harbor 승인 digest 확정 후 실제 native UID로 재확정 필요
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch   # Storage 인계 결정(#17) 수용
      containers:
      - name: alertmanager
        # 2026-10-02: :latest(Always) → 현장 실행 digest로 고정(이미지 내용 불변). Harbor Trivy 2026-10-02 Critical 0 / High 1
        # (grpc CVE-2026-84445) — HBR 0/0 기준 예외·업그레이드는 #13 결정(#17).
        image: 10.1.93.54/fds/alertmanager@sha256:babefaac616bdb9fb5037a2b70a3c0ffa988c68e96443621dd7360e60781ab67
        args:
        - --config.file=/etc/alertmanager/alertmanager.yml
        - --storage.path=/alertmanager
        ports:
        - containerPort: 9093
        # #17 Resource 명시(2026-09-29). 관측 CPU 최대 2.6m, working set 최대 51.4MiB, 재시작 0.
        # #15 결정안 v2 식 결과(100m/64Mi·100m/128Mi)가 LimitRange 기본값보다 작아 기본값을 명시값으로 둔다.
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        # #17 AC: 컴포넌트 공식 Probe. startup 이 통과할 때까지 liveness/readiness 는 시작되지 않는다.
        startupProbe:
          httpGet: { path: /-/ready, port: 9093 }
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 36        # 최대 3분 기동 유예
        readinessProbe:
          httpGet: { path: /-/ready, port: 9093 }
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet: { path: /-/healthy, port: 9093 }
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 6         # 2분 연속 실패해야 재시작(오탐 재시작 루프 방지)
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: config
          mountPath: /etc/alertmanager
        - name: storage
          mountPath: /alertmanager
        # CR-P1-MON-01-02(#75): Discord webhook URL은 Secret 파일로만 참조한다(평문 저장 금지, D33 예외 — D-ID 등록 대기).
        # subPath를 쓰지 않는다 — Secret 갱신이 볼륨으로 전파되고, v0.34.1 Discord notifier가
        # 알림마다 webhook_url_file을 다시 읽는다(docs/ALERTMANAGER_SECRET_LIFECYCLE_REVIEW_20260924.md).
        - name: discord-webhook
          mountPath: /etc/alertmanager/secrets/discord
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: alertmanager-config
      - name: storage
        # Storage 인계 결정(GitHub #17, Lead 이재환 2026-09-21): worker03 host path, PVC 2Gi.
        # emptyDir → PVC 이전: 재시작 시 silence/notification 상태 유실 방지.
        persistentVolumeClaim:
          claimName: alertmanager-data
      - name: discord-webhook
        # Secret(key=webhook_url)은 #75 Lead가 저장소 밖에서 생성·회전한다. 값·YAML을 커밋하지 않는다.
        secret:
          secretName: discord-webhook
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring-api
spec:
  selector:
    app: alertmanager
  ports:
  - port: 9093
    targetPort: 9093
