# 2026-09-27 baseline 명세 SA 이름 전환(#17): Alertmanager·Grafana 전용 ServiceAccount.
# 둘 다 Kubernetes API 를 호출하지 않으므로 RBAC 을 부여하지 않고 토큰 자동 마운트를 끈다.
# (default SA 를 쓰지 않아, 같은 namespace 의 default 에 권한이 붙어도 영향을 받지 않는다.)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alertmanager-sa
  namespace: monitoring-api
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-sa
  namespace: monitoring-api
automountServiceAccountToken: false
