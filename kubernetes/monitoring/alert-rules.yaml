apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alert-rules
  namespace: monitoring-api
data:
  # 코어 알림 규칙 — 시나리오 v1.5 정렬. 타깃/스크레이프 건강. S8(TC-TARGET) 대상.
  #
  #  S7b(TC-ALERT) P0 Test Alert  → p0-test-alert.yaml
  #  선택적 고도화 후보(FDSDetectionBurst 등) → alert-rules-optional.yaml
  #    (E-CANON 전용. E-K3S 에는 적용하지 않는다 — ClusterIP 라운드로빈으로 상시 오탐.)
  #
  # Prometheus 는 rule 파일을 자동 reload 하지 않는다 → ConfigMap 변경 후
  #   kubectl -n monitoring-api exec deploy/prometheus -- wget -qO- --post-data='' localhost:9090/-/reload
  alert-rules.yml: |
    groups:
    - name: fds-core-observability
      rules:

      # GWONUK 리뷰 B3(PR #4) 대응(2026-09-21): node-exporter 타깃이 실 Worker 3대(prometheus.yaml)로
      # 교체됨에 따라 "k3s-hairpin known-issue" 프레이밍은 더 이상 사실과 맞지 않아 제거함.
      # 2026-09-23: DaemonSet Pod 3개 실행 확인됨. 다만 Prometheus Pod와 다른 노드는 GNP 크로스노드
      # 이슈로 스크레이프가 안 돼서 상시 firing — S8/TargetDown에는 그 이슈(baseline#19) 해소 전까지
      # 편입하지 않는다(오탐성 상시 알림 방지).
      - alert: NodeExporterDown
        expr: up{job="node-exporter"} == 0
        for: 30s
        labels:
          severity: warning
          known_issue: "gnp-crossnode-pod-cidr"
          kr: "노드 지표 수집 실패"
        annotations:
          summary: "node-exporter target is down"
          description: "{{ $labels.instance }} 스크레이프 실패. E-CANON Worker 3대(.105/.107/.108) 대상 — DaemonSet Pod 3개 실행은 2026-09-23 확인됨. Prometheus Pod와 다른 노드만 타임아웃이라 kubelet과 동일한 GNP 크로스노드 이슈로 추정(baseline#19). S8/TargetDown 대상 아님."

      # kubelet(10250) : 2026-09-23 정본 실측 기준으로 재작성(구 KubeletScrapeDownK3s, E-K3S hairpin 문구 제거).
      # 정본 6노드에서 kubelet/cadvisor 12개 타깃 전부 down — Calico GNP가 kubelet(10250)을 호스트 IP
      # 소스만 허용해서, VXLAN 디캡슐화 후 출발지로 노출되는 Pod CIDR(10.244.0.0/16)이 걸리는 것으로 추정
      # (정황 근거, 서버 측 deny 카운터 대조 전). 같은 노드는 TLS IP SAN 부재로 별도 실패.
      # 정책 변경은 P1-SEC/K8S 담당 판단 사항 → fds-project-baseline#19 코멘트로 에스컬레이션함.
      - alert: KubeletScrapeDown
        expr: up{job=~"kubelet|kubelet-cadvisor"} == 0
        for: 2m
        labels:
          severity: info
          known_issue: "gnp-crossnode-pod-cidr"
          kr: "kubelet 지표 수집 실패 (Pod→kubelet 경로)"
        annotations:
          summary: "kubelet scrape down ({{ $labels.instance }})"
          description: "Prometheus Pod→{{ $labels.instance }} kubelet(:10250) 스크레이프 실패. 정본 6노드 전체에서 확인된 알려진 이슈(GNP Pod CIDR 미허용 추정 + kubelet 인증서 IP SAN 부재) — 원인·제안은 baseline#19 참조, 정책 담당 판단 대기. S8/TargetDown 대상 아님."

      # S8 / TC-TARGET : 스크레이프 타깃 다운. node-exporter/kubelet 은 위 known-issue 로 분리 → 제외.
      - alert: TargetDown
        expr: up{job=~"transaction-api|fds-engine|kube-state-metrics"} == 0
        for: 1m
        labels:
          severity: critical
          kr: "관측 대상 다운"
        annotations:
          summary: "scrape target {{ $labels.job }} is down"
          description: "{{ $labels.job }} ({{ $labels.instance }}) 를 1분 이상 스크레이프하지 못함."
