apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alert-rules
  namespace: monitoring-api
data:
  # 코어 알림 규칙 — 시나리오 v1.5 정렬. 타깃/스크레이프 건강. S8(TC-TARGET) 대상.
  #
  #  S7b(TC-ALERT) P0 Test Alert  → p0-test-alert.yaml
  #  선택적 고도화 후보(FDSDetectionBurst 등) → alert-rules-optional.yaml
  #    (E-CANON 전용. E-K3S 에는 적용하지 않는다 — ClusterIP 라운드로빈으로 상시 오탐.)
  #
  # Prometheus 는 rule 파일을 자동 reload 하지 않는다 → ConfigMap 변경 후
  #   kubectl -n monitoring-api exec deploy/prometheus -- wget -qO- --post-data='' localhost:9090/-/reload
  alert-rules.yml: |
    groups:
    - name: fds-core-observability
      rules:

      # GWONUK 리뷰 B3(PR #4) 대응(2026-09-21): node-exporter 타깃이 실 Worker 3대(prometheus.yaml)로
      # 교체됨에 따라 "k3s-hairpin known-issue" 프레이밍은 더 이상 사실과 맞지 않아 제거함.
      # ⚠️ NOT VERIFIED로 대체: DaemonSet이 실제로 이 3대 전부에 스케줄되는지는 정본 클러스터
      # 실측 전이다(kubectl get pods -n monitoring-node -o wide로 확인). S8/TargetDown에는 아직
      # 포함하지 않음 — 스케줄 가정이 틀리면 상시 오탐이 될 수 있어 실측 후 편입 여부를 재검토.
      - alert: NodeExporterDown
        expr: up{job="node-exporter"} == 0
        for: 30s
        labels:
          severity: warning
          not_verified: "e-canon-daemonset-schedule"
          kr: "노드 지표 수집 실패"
        annotations:
          summary: "node-exporter target is down"
          description: "{{ $labels.instance }} 스크레이프 실패. E-CANON Worker 3대(.105/.107/.108) 대상 — DaemonSet 실제 스케줄 여부 NOT VERIFIED. S8/TargetDown 대상 아님(오탐 위험으로 별도 분리)."

      # kubelet(10250) : E-K3S에서는 pod→노드 자기 IP 도달 제약(No route to host)이 원인이었다.
      # E-CANON에서는 kubelet 타깃도 실 6-node IP로 교체됨(prometheus.yaml) — 아래 known_issue
      # 라벨/설명은 여전히 E-K3S 기준으로 남아있음(OPEN, 위 주석 참조. NodeExporterDown과 달리
      # 이번 PR 리뷰에서 차단 대상으로 지적되지 않아 이번 수정 범위에는 포함하지 않음).
      - alert: KubeletScrapeDownK3s
        expr: up{job=~"kubelet|kubelet-cadvisor"} == 0
        for: 2m
        labels:
          severity: info
          known_issue: "k3s-hairpin"
          kr: "kubelet 지표 수집 실패 (k3s 단일노드 한계)"
        annotations:
          summary: "kubelet scrape down (edge01 k3s 단일노드 hairpin)"
          description: "pod→노드 IP(:10250) 도달 제약. 실 6노드(.102~.105/.107/.108:10250)에서는 정석. S8 대상 아님."

      # S8 / TC-TARGET : 스크레이프 타깃 다운. node-exporter/kubelet 은 위 known-issue 로 분리 → 제외.
      - alert: TargetDown
        expr: up{job=~"transaction-api|fds-engine|kube-state-metrics"} == 0
        for: 1m
        labels:
          severity: critical
          kr: "관측 대상 다운"
        annotations:
          summary: "scrape target {{ $labels.job }} is down"
          description: "{{ $labels.job }} ({{ $labels.instance }}) 를 1분 이상 스크레이프하지 못함."
