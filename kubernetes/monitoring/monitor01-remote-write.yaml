# 현장에 같은 이름의 객체가 이미 있다(#14 ICR 기록 2026-09-24, 소스 없음). 적용 전 `kubectl diff`로
# 대조하고, 허용 범위가 아래(Prometheus Pod → 10.250.10.30/32 TCP 443)보다 넓거나 다르면 중단한다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-remote-write-allow
  namespace: monitoring-api
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.250.10.30/32   # monitor01
      ports:
        - protocol: TCP
          port: 443
