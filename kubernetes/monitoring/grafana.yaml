apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring-api
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus            # A3: 대시보드 JSON 이 이 uid 로 참조
        type: prometheus
        access: proxy
        url: http://prometheus.monitoring-api.svc:9090   # #17 요구사항 표기(FQDN). 이전 값 http://prometheus:9090(같은 Service)
        isDefault: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring-api
spec:
  replicas: 1
  strategy:
    type: Recreate            # A3: PVC(RWO) 재부착 충돌 방지
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      imagePullSecrets:
        - name: harbor-pull-secret
      serviceAccountName: grafana-sa   # 2026-09-27 전용 SA(monitoring-api-serviceaccounts.yaml)
      automountServiceAccountToken: false   # GWONUK 리뷰 비차단#3(PR #4): K8s API 호출 안 함
      securityContext:
        runAsNonRoot: true
        runAsUser: 472   # OPEN(#17): Harbor 승인 digest 확정 후 실제 native UID로 재확정 필요
        fsGroup: 472
        fsGroupChangePolicy: OnRootMismatch   # Storage 인계 결정(#17) 수용
      containers:
        - name: grafana
          # 2026-10-02: :latest(Always) → 현장 실행 digest로 고정(이미지 내용 불변). Harbor Trivy 2026-10-02 Critical 0 / High 72
          # — HBR 0/0 기준 예외·업그레이드는 #13 결정(#17).
          image: 10.1.93.54/fds/grafana@sha256:7a1ff54408c90357ff1c76189e5bbc24f898531cb771fbbfe6a477f00de37d5b
          ports:
            - containerPort: 3000
          # #17 AC: 컴포넌트 공식 Probe(/api/health 는 인증 불필요). startup 통과 전에는 다른 Probe 미시작.
          startupProbe:
            httpGet: { path: /api/health, port: 3000 }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60      # 최대 5분 기동 유예(대시보드 provisioning)
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /api/health, port: 3000 }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin-credentials
                  key: admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin-credentials
                  key: admin-password
              # Secret은 이 리포에 커밋하지 않는다(CLAUDE.md §6, 원문 금지). 정본 배포 전 직접 생성:
              #   kubectl -n monitoring-api create secret generic grafana-admin-credentials \
              #     --from-literal=admin-user='<계정명>' --from-literal=admin-password='<비밀번호>'
            # GWONUK 리뷰 비차단#1(PR #4): CANONICAL_POLICY.md "Anonymous·Sign-up 금지" 명시화.
            # Grafana 기본값 자체가 이미 비활성이지만 정본 의도를 값으로 고정한다.
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            # 노드는 GNP로 인터넷 차단(Gate2). Grafana가 시작 시 grafana.com으로
            # 플러그인 버전 확인을 시도하다 타임아웃 → prometheus 등 내장 플러그인까지
            # 로딩 실패하는 문제 발견(2026-09-22) — 업데이트 확인 자체를 꺼서 해결.
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES
              value: "false"
            # 위 analytics 설정으로도 plugin.backgroundinstaller(grafana-advisor-app 등
            # 사전설치 플러그인 목록)가 grafana.com에 계속 재시도하는 걸 못 막아서 추가.
            - name: GF_PLUGINS_PREINSTALL_DISABLED
              value: "true"
          # monitoring-api-default-limits LimitRange 기본값(512Mi)이 부족해서
          # OOMKilled(exit 137) 반복 발생(2026-09-22 실측) — 명시적으로 상향.
          # 2026-09-29 재산정: 관측 9/26 23:47~9/29 18:25 KST working set 최대 916.3MiB(1Gi의 89%),
          # CPU p95 8.1m·최대 37.1m. #15 결정안 v2 식으로 메모리 request 1152Mi·limit 2304Mi,
          # CPU는 식 결과(100m/100m)가 현재 값보다 작아 200m/1을 유지.
          resources:
            requests:
              cpu: 200m
              memory: 1152Mi
            limits:
              cpu: "1"
              memory: 2304Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: tmp
              mountPath: /tmp
            - name: plugins
              mountPath: /var/lib/grafana/plugins
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            # A3: 대시보드 provisioning (provider 정의 + 대시보드 JSON)
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /etc/grafana/dashboards      # PVC(/var/lib/grafana) 하위 중첩 마운트 회피
      volumes:
        - name: data
          # A3: emptyDir → PVC. Pod 재기동/재스케줄에도 대시보드 편집·주석 유지.
          persistentVolumeClaim:
            claimName: grafana-data
        - name: tmp
          emptyDir: {}
        - name: plugins
          emptyDir: {}
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-provider
          configMap:
            name: grafana-dashboards-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring-api
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
