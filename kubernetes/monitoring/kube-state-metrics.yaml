apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: monitoring-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-state-metrics
  template:
    metadata:
      labels:
        app: kube-state-metrics
    spec:
      imagePullSecrets:
        - name: harbor-pull-secret
      serviceAccountName: kube-state-metrics-sa
      containers:
        - name: kube-state-metrics
          # 2026-10-02: tag v2.13.0 → 현장 실행 digest로 고정(이미지 내용 불변). Harbor Trivy 2026-10-02 Critical 1 / High 44
          # (Go 1.22.5 등) — HBR 0/0 기준 예외·업그레이드는 #13 결정(#17).
          image: 10.1.93.54/fds/kube-state-metrics@sha256:8ca59a9893ecaebbea478099d99a9ffc9daa9f285a715adfa945246b111322a1
          args:
            # A2/S1 : UnexpectedPodInFdsNs 룰이 kube_pod_labels{label_app=...} 를 쓰려면
            # pod 라벨을 명시 allowlist 해야 한다 (v2.x 기본은 라벨 미노출).
            - --metric-labels-allowlist=pods=[app],deployments=[app]
          ports:
            - containerPort: 8080
              name: http-metrics
            - containerPort: 8081
              name: telemetry
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          # #17 보조통제: kube-state-metrics v2.13.0 공식 예제(examples/standard/deployment.yaml)와 같이
          # Liveness는 /livez(http-metrics 8080), Readiness는 /readyz(telemetry 8081)를 쓴다.
          # initialDelaySeconds·timeoutSeconds도 공식 예제 값(5/5)과 맞춘다.
          readinessProbe:
            httpGet:
              path: /readyz
              port: telemetry
            initialDelaySeconds: 5
            timeoutSeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: http-metrics
            initialDelaySeconds: 5
            timeoutSeconds: 5     # /livez는 kube-apiserver에 위임 — 기본 1s면 API 지연만으로 재시작될 수 있음
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: monitoring-api
spec:
  selector:
    app: kube-state-metrics
  ports:
    - name: http-metrics
      port: 8080
      targetPort: 8080
