apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: monitoring-node
  labels:
    app: node-exporter
spec:
  selector:
    matchLabels:
      app: node-exporter
  template:
    metadata:
      labels:
        app: node-exporter
    spec:
      imagePullSecrets:
        - name: harbor-pull-secret
      serviceAccountName: node-exporter-sa
      hostNetwork: true
      hostPID: true
      containers:
        - name: node-exporter
          image: 10.1.93.54/fds/node-exporter@sha256:56566542aacd5be06add01d3456cd6279e2f7ddb4b24237fc8cdfbc3cc5f699f
          args:
            - --path.rootfs=/host
          ports:
            - containerPort: 9100
              hostPort: 9100
          volumeMounts:
            - name: rootfs
              mountPath: /host
              readOnly: true
          securityContext:
            # GWONUK 리뷰 B4(PR #4): namespace가 enforce=privileged라 privileged:true도
            # admission을 통과하지만, 실제로 privileged 권한이 필요 없으므로 명시적으로 false 고정
            # + seccompProfile 추가(CANONICAL_POLICY.md "privileged=true 허용으로 해석하지 않는다").
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9100
            periodSeconds: 10
      volumes:
        - name: rootfs
          hostPath:
            path: /
---
apiVersion: v1
kind: Service
metadata:
  name: node-exporter
  namespace: monitoring-node
spec:
  selector:
    app: node-exporter
  ports:
    - port: 9100
      targetPort: 9100
