# GWONUK 리뷰 B1(PR #4) 대응: kube-state-metrics.yaml/node-exporter.yaml이 참조하는
# ServiceAccount가 어느 파일에도 없어 kubectl apply 시 거부됨. ClusterRole/Binding은
# references/e-k3s/kubernetes/d-sec-01/rbac-kube-state-metrics.yaml(D33 Mandatory
# Control, KSM RBAC 분리)을 그대로 가져옴 — 범위를 임의로 넓히거나 좁히지 않음.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics-sa
  namespace: monitoring-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics-role
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - pods
      - services
      - endpoints
      - namespaces
      - configmaps
      - persistentvolumeclaims
      - resourcequotas
      - replicationcontrollers
      - limitranges
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - networkpolicies
      - ingresses
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics-role
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics-sa
    namespace: monitoring-api
---
# node-exporter는 K8s API를 호출하지 않고 hostPath(/host, 읽기전용)만 읽는다 — ClusterRole
# 불필요, ServiceAccount 존재 자체만 필요(참조 해소 목적).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-exporter-sa
  namespace: monitoring-node
